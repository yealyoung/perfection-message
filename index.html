<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>잠깐, 숨 고르기</title>
  <style>
    :root {
      --bg1: #f7f1ea;
      --bg2: #f1e9df;
      --card: rgba(255, 252, 248, 0.8);
      --brown: #5a4335;
      --brown-soft: #7b6759;
      --brown-light: #9a887b;
      --line: rgba(120, 95, 75, 0.14);
      --button1: #6c5445;
      --button2: #5a4335;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      color: var(--brown);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 14% 10%, rgba(255,255,255,0.94), transparent 24%),
        linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
    }

    /* 종이 결 */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.15;
      pointer-events: none;
      background-image:
        repeating-linear-gradient(
          0deg,
          rgba(120,95,75,0.02) 0px,
          rgba(120,95,75,0.02) 1px,
          transparent 1px,
          transparent 5px
        );
    }

    /* 창가 빛 */
    body::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.55;
      background:
        linear-gradient(
          120deg,
          rgba(255,255,255,0.55) 0%,
          rgba(255,255,255,0.05) 18%,
          rgba(255,255,255,0.28) 36%,
          rgba(255,255,255,0.04) 54%,
          rgba(255,255,255,0.14) 72%,
          rgba(255,255,255,0.00) 100%
        );
      transform: translateX(-3%);
    }

    .page-glow {
      position: absolute;
      inset: auto 0 -30px 0;
      height: 240px;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at center,
          rgba(255,255,255,0.75) 0%,
          rgba(255,255,255,0.25) 42%,
          rgba(255,255,255,0.00) 76%
        );
      filter: blur(10px);
    }

    .card {
      width: 100%;
      max-width: 500px;
      min-height: 680px;
      padding: 42px 30px 34px;
      border-radius: 30px;
      position: relative;
      z-index: 1;
      text-align: center;
      background:
        linear-gradient(rgba(255,252,248,0.74), rgba(255,252,248,0.80));
      border: 1px solid rgba(255,255,255,0.54);
      box-shadow:
        0 22px 48px rgba(90, 67, 53, 0.08),
        0 8px 18px rgba(90, 67, 53, 0.05),
        inset 0 1px 0 rgba(255,255,255,0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .brand {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 14px;
      letter-spacing: 0.22em;
      color: var(--brown-soft);
      margin-bottom: 24px;
    }

    .title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 31px;
      font-weight: 400;
      letter-spacing: -0.01em;
      margin: 0 0 12px;
      color: var(--brown);
    }

    .subtitle {
      font-size: 15px;
      line-height: 1.85;
      color: var(--brown-soft);
      margin: 0 0 24px;
      word-break: keep-all;
    }

    .divider {
      width: 34px;
      height: 1px;
      background: var(--line);
      margin: 0 auto 28px;
    }

    .fortune-stage {
      position: relative;
      min-height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .screen {
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    .hidden {
      display: none;
    }

    .fade-out {
      opacity: 0;
      transform: translateY(8px);
    }

    .fade-in {
      opacity: 1;
      transform: translateY(0);
    }

    .fortune-intro {
      color: var(--brown-soft);
      font-size: 16px;
      line-height: 1.9;
      margin: 0 0 32px;
      word-break: keep-all;
    }

    .button-wrap {
      margin-top: 10px;
    }

    button {
      appearance: none;
      border: none;
      cursor: pointer;
      border-radius: 999px;
      padding: 14px 24px;
      font-size: 15px;
      line-height: 1;
      color: #fff;
      background: linear-gradient(180deg, var(--button1) 0%, var(--button2) 100%);
      box-shadow:
        0 10px 22px rgba(90, 67, 53, 0.16),
        inset 0 1px 0 rgba(255,255,255,0.16);
      transition: transform 0.22s ease, box-shadow 0.22s ease, opacity 0.22s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow:
        0 14px 26px rgba(90, 67, 53, 0.18),
        inset 0 1px 0 rgba(255,255,255,0.18);
    }

    button:active {
      transform: translateY(0);
    }

    .sub-button {
      margin-top: 24px;
      background: transparent;
      color: var(--brown-soft);
      box-shadow: none;
      border: 1px solid rgba(120,95,75,0.12);
    }

    .sub-button:hover {
      background: rgba(255,255,255,0.45);
      box-shadow: none;
    }

    /* 쿠키 화면 */
    .cookie-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 260px;
    }

    .cookie-shell {
      position: relative;
      width: 190px;
      height: 150px;
      margin-bottom: 18px;
    }

    .cookie-half {
      position: absolute;
      top: 22px;
      width: 88px;
      height: 92px;
      background: linear-gradient(180deg, #e6c6a6 0%, #d9af89 100%);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.28),
        0 10px 18px rgba(90, 67, 53, 0.14);
      border-radius: 55% 55% 48% 48%;
    }

    .cookie-left {
      left: 10px;
      transform-origin: 90% 75%;
      clip-path: polygon(0 18%, 100% 0, 90% 100%, 14% 78%);
    }

    .cookie-right {
      right: 10px;
      transform-origin: 10% 75%;
      clip-path: polygon(0 0, 100% 18%, 86% 78%, 10% 100%);
    }

    .cookie-fold {
      position: absolute;
      left: 50%;
      top: 54px;
      width: 28px;
      height: 28px;
      background: linear-gradient(180deg, #e2bf9a 0%, #d4aa83 100%);
      border-radius: 50%;
      transform: translateX(-50%);
      box-shadow: 0 4px 10px rgba(90,67,53,0.10);
    }

    .fortune-paper {
      position: absolute;
      left: 50%;
      top: 64px;
      width: 86px;
      height: 22px;
      background: #fffaf5;
      border-radius: 4px;
      border: 1px solid rgba(120,95,75,0.10);
      transform: translateX(-50%) translateY(10px);
      opacity: 0;
      box-shadow: 0 6px 14px rgba(90,67,53,0.08);
    }

    .cookie-text {
      font-size: 14px;
      color: var(--brown-soft);
      line-height: 1.8;
      margin-top: 6px;
    }

    .cookie-shell.open .cookie-left {
      animation: cookieLeftOpen 0.7s ease forwards;
    }

    .cookie-shell.open .cookie-right {
      animation: cookieRightOpen 0.7s ease forwards;
    }

    .cookie-shell.open .fortune-paper {
      animation: paperRise 0.55s ease 0.34s forwards;
    }

    .cookie-shell.open .cookie-fold {
      opacity: 0.4;
      transition: opacity 0.3s ease;
    }

    @keyframes cookieLeftOpen {
      0% {
        transform: rotate(0deg) translateX(0);
      }
      100% {
        transform: rotate(-30deg) translateX(-16px) translateY(-2px);
      }
    }

    @keyframes cookieRightOpen {
      0% {
        transform: rotate(0deg) translateX(0);
      }
      100% {
        transform: rotate(30deg) translateX(16px) translateY(-2px);
      }
    }

    @keyframes paperRise {
      0% {
        opacity: 0;
        transform: translateX(-50%) translateY(12px) scale(0.96);
      }
      100% {
        opacity: 1;
        transform: translateX(-50%) translateY(-26px) scale(1);
      }
    }

    /* 결과 화면 */
    .fortune-card {
      border-radius: 24px;
      padding: 24px 22px 22px;
      background: rgba(255, 250, 245, 0.72);
      border: 1px solid rgba(255,255,255,0.6);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.55);
    }

    .fortune-label {
      font-size: 13px;
      line-height: 1.7;
      letter-spacing: 0.06em;
      color: var(--brown-light);
      margin-bottom: 10px;
    }

    .fortune-type {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
      line-height: 1.5;
      color: var(--brown);
      margin-bottom: 16px;
      word-break: keep-all;
    }

    .fortune-message {
      font-size: 20px;
      line-height: 1.9;
      color: var(--brown);
      white-space: pre-line;
      word-break: keep-all;
    }

    .footer-line {
      width: 110px;
      height: 1px;
      background: var(--line);
      margin: 30px auto 18px;
    }

    .footer {
      font-size: 13px;
      line-height: 1.85;
      color: var(--brown-light);
      word-break: keep-all;
    }

    @media (max-width: 480px) {
      body {
        padding: 18px;
      }

      .card {
        min-height: 640px;
        padding: 34px 22px 28px;
        border-radius: 26px;
      }

      .brand {
        font-size: 13px;
        margin-bottom: 22px;
      }

      .title {
        font-size: 28px;
      }

      .subtitle {
        font-size: 14px;
        margin-bottom: 22px;
      }

      .divider {
        margin-bottom: 24px;
      }

      .fortune-stage {
        min-height: 340px;
      }

      .fortune-intro {
        font-size: 15px;
      }

      .cookie-shell {
        width: 170px;
        height: 140px;
      }

      .cookie-half {
        width: 78px;
        height: 84px;
      }

      .fortune-type {
        font-size: 25px;
      }

      .fortune-message {
        font-size: 18px;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="page-glow"></div>

  <div class="card">
    <div class="brand">Perfection</div>
    <h1 class="title">잠깐, 숨 고르기</h1>
    <p class="subtitle">오늘의 메시지를 열어보세요</p>
    <div class="divider"></div>

    <div class="fortune-stage">
      <!-- 첫 화면 -->
      <div class="screen" id="introScreen">
        <p class="fortune-intro">
          오늘의 작은 메시지가 도착했어요.<br>
          지금의 나를 위한 한 문장을 열어보세요.
        </p>

        <div class="button-wrap">
          <button onclick="openFortune()">포춘 열기</button>
        </div>
      </div>

      <!-- 쿠키 화면 -->
      <div class="screen hidden" id="cookieScreen">
        <div class="cookie-wrap">
          <div class="cookie-shell" id="fortuneCookie">
            <div class="cookie-half cookie-left"></div>
            <div class="cookie-half cookie-right"></div>
            <div class="cookie-fold"></div>
            <div class="fortune-paper"></div>
          </div>
          <div class="cookie-text">또각, 오늘의 포춘을 여는 중...</div>
        </div>
      </div>

      <!-- 결과 화면 -->
      <div class="screen hidden" id="resultScreen">
        <div class="fortune-card">
          <div class="fortune-label">오늘의 회복 타입</div>
          <div class="fortune-type" id="fortuneType"></div>
          <div class="fortune-message" id="fortuneMessage"></div>
        </div>

        <div class="button-wrap">
          <button class="sub-button" onclick="showAnotherFortune()">다른 메시지 보기</button>
        </div>
      </div>
    </div>

    <div class="footer-line"></div>
    <div class="footer">
      HAROO 브라와 함께 보내는<br>
      작은 위로 한 장
    </div>
  </div>

  <script>
    const fortunes = [
      {
        type: "작은 숨 타입",
        message: "오늘은 조금 덜 애써도 괜찮아요."
      },
      {
        type: "햇살 타입",
        message: "작은 불편 하나만 덜어도 하루가 달라져요."
      },
      {
        type: "느린 호흡 타입",
        message: "천천히 가도 괜찮아요."
      },
      {
        type: "가벼운 하루 타입",
        message: "조금 더 가볍게 숨 쉬는 하루가 되길 바랍니다."
      },
      {
        type: "따뜻한 휴식 타입",
        message: "작은 휴식 하나도 충분히 의미 있어요."
      },
      {
        type: "조용한 회복 타입",
        message: "지금의 하루가 조금 덜 복잡하길 바랍니다."
      },
      {
        type: "물 한 잔 타입",
        message: "물 한 잔 챙기는 것도 충분한 돌봄이에요."
      },
      {
        type: "덜 무거운 하루 타입",
        message: "조금 덜 무겁고,\n조금 더 편안한 하루가 되길 바랍니다."
      },
      {
        type: "천천히 괜찮은 타입",
        message: "다 하지 못해도 괜찮아요."
      },
      {
        type: "참지 않아도 되는 타입",
        message: "불편함을 참지 않아도 괜찮아요."
      },
      {
        type: "작은 쉼표 타입",
        message: "오늘은 한 템포 쉬어가도 괜찮아요."
      },
      {
        type: "몸 먼저 타입",
        message: "오늘도 몸이 먼저인 하루를 보내요."
      },
      {
        type: "오늘도 충분한 타입",
        message: "오늘도 충분히 잘하고 있어요."
      },
      {
        type: "느긋한 회복 타입",
        message: "오늘의 나를 너무 몰아붙이지 않기로 해요."
      },
      {
        type: "부드러운 숨 타입",
        message: "조금 더 부드럽게 숨 쉬는 하루가 되길 바랍니다."
      },
      {
        type: "가만한 위로 타입",
        message: "지금 이 순간에도 이미 충분해요."
      },
      {
        type: "한 템포 쉬어가기 타입",
        message: "몸이 편해야 마음도 조금 덜 지쳐요."
      },
      {
        type: "작은 편안함 타입",
        message: "참는 것보다 편안한 쪽을 먼저 골라요."
      },
      {
        type: "덜 애써도 되는 타입",
        message: "오늘은 조금 덜 애써도 괜찮아요."
      },
      {
        type: "온전한 오늘 타입",
        message: "HAROO 브라가 오늘을\n조금 더 가볍게 만들어주길 바랍니다."
      }
    ];

    function randomFortune() {
      const index = Math.floor(Math.random() * fortunes.length);
      return fortunes[index];
    }

    function openFortune() {
      const intro = document.getElementById("introScreen");
      const cookieScreen = document.getElementById("cookieScreen");
      const result = document.getElementById("resultScreen");
      const cookie = document.getElementById("fortuneCookie");

      intro.classList.add("fade-out");

      setTimeout(() => {
        intro.classList.add("hidden");
        intro.classList.remove("fade-out");

        cookieScreen.classList.remove("hidden");
        cookieScreen.classList.add("fade-in");

        setTimeout(() => {
          cookie.classList.add("open");
        }, 120);

        setTimeout(() => {
          const today = randomFortune();
          document.getElementById("fortuneType").textContent = today.type;
          document.getElementById("fortuneMessage").innerHTML = today.message.replace(/\n/g, "<br>");

          cookieScreen.classList.add("fade-out");

          setTimeout(() => {
            cookieScreen.classList.add("hidden");
            cookieScreen.classList.remove("fade-in");
            cookieScreen.classList.remove("fade-out");
            cookie.classList.remove("open");

            result.classList.remove("hidden");
            result.classList.add("fade-in");

            setTimeout(() => {
              result.classList.remove("fade-in");
            }, 450);
          }, 320);
        }, 1450);
      }, 220);
    }

    function showAnotherFortune() {
      const result = document.getElementById("resultScreen");
      result.classList.add("fade-out");

      setTimeout(() => {
        const today = randomFortune();
        document.getElementById("fortuneType").textContent = today.type;
        document.getElementById("fortuneMessage").innerHTML = today.message.replace(/\n/g, "<br>");
        result.classList.remove("fade-out");
        result.classList.add("fade-in");

        setTimeout(() => {
          result.classList.remove("fade-in");
        }, 450);
      }, 220);
    }
  </script>
</body>
</html>
