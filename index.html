<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>잠깐, 숨 고르기</title>
  <style>
    :root {
      --bg1: #f7f1ea;
      --bg2: #f1e9df;
      --brown: #5a4335;
      --brown-soft: #7b6759;
      --brown-light: #9a887b;
      --line: rgba(120, 95, 75, 0.14);
      --button1: #6c5445;
      --button2: #5a4335;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      color: var(--brown);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 14% 10%, rgba(255,255,255,0.94), transparent 24%),
        linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
    }

    /* 종이 질감 */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.13;
      pointer-events: none;
      background-image:
        repeating-linear-gradient(
          0deg,
          rgba(120,95,75,0.02) 0px,
          rgba(120,95,75,0.02) 1px,
          transparent 1px,
          transparent 5px
        );
    }

    /* 창가 빛 */
    body::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.55;
      background:
        linear-gradient(
          120deg,
          rgba(255,255,255,0.58) 0%,
          rgba(255,255,255,0.06) 18%,
          rgba(255,255,255,0.30) 36%,
          rgba(255,255,255,0.05) 54%,
          rgba(255,255,255,0.16) 72%,
          rgba(255,255,255,0.00) 100%
        );
      transform: translateX(-3%);
    }

    .page-glow {
      position: absolute;
      inset: auto 0 -30px 0;
      height: 240px;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at center,
          rgba(255,255,255,0.78) 0%,
          rgba(255,255,255,0.24) 42%,
          rgba(255,255,255,0.00) 76%
        );
      filter: blur(10px);
    }

    .card {
      width: 100%;
      max-width: 500px;
      min-height: 690px;
      padding: 42px 30px 34px;
      border-radius: 30px;
      position: relative;
      z-index: 2;
      text-align: center;
      background:
        linear-gradient(rgba(255,252,248,0.76), rgba(255,252,248,0.82));
      border: 1px solid rgba(255,255,255,0.54);
      box-shadow:
        0 22px 48px rgba(90, 67, 53, 0.08),
        0 8px 18px rgba(90, 67, 53, 0.05),
        inset 0 1px 0 rgba(255,255,255,0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      overflow: hidden;
    }

    .brand {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 14px;
      letter-spacing: 0.22em;
      color: var(--brown-soft);
      margin-bottom: 24px;
    }

    .title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 31px;
      font-weight: 400;
      letter-spacing: -0.01em;
      margin: 0 0 12px;
      color: var(--brown);
    }

    .subtitle {
      font-size: 15px;
      line-height: 1.85;
      color: var(--brown-soft);
      margin: 0 0 24px;
      word-break: keep-all;
    }

    .divider {
      width: 34px;
      height: 1px;
      background: var(--line);
      margin: 0 auto 28px;
    }

    .fortune-stage {
      position: relative;
      min-height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .screen {
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    .hidden { display: none; }

    .fade-out {
      opacity: 0;
      transform: translateY(8px);
    }

    .fade-in {
      opacity: 1;
      transform: translateY(0);
    }

    .fortune-intro {
      color: var(--brown-soft);
      font-size: 16px;
      line-height: 1.9;
      margin: 0 0 32px;
      word-break: keep-all;
    }

    .button-wrap {
      margin-top: 10px;
    }

    button {
      appearance: none;
      border: none;
      cursor: pointer;
      border-radius: 999px;
      padding: 14px 24px;
      font-size: 15px;
      line-height: 1;
      color: #fff;
      background: linear-gradient(180deg, var(--button1) 0%, var(--button2) 100%);
      box-shadow:
        0 10px 22px rgba(90, 67, 53, 0.16),
        inset 0 1px 0 rgba(255,255,255,0.16);
      transition: transform 0.22s ease, box-shadow 0.22s ease, opacity 0.22s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow:
        0 14px 26px rgba(90, 67, 53, 0.18),
        inset 0 1px 0 rgba(255,255,255,0.18);
    }

    button:active {
      transform: translateY(0);
    }

    .sub-button {
      margin-top: 24px;
      background: transparent;
      color: var(--brown-soft);
      box-shadow: none;
      border: 1px solid rgba(120,95,75,0.12);
    }

    .sub-button:hover {
      background: rgba(255,255,255,0.45);
      box-shadow: none;
    }

    /* 쿠키 */
    .cookie-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 260px;
    }

    .cookie-shell {
      position: relative;
      width: 190px;
      height: 150px;
      margin-bottom: 18px;
    }

    .cookie-half {
      position: absolute;
      top: 22px;
      width: 88px;
      height: 92px;
      background: linear-gradient(180deg, #e6c6a6 0%, #d9af89 100%);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.28),
        0 10px 18px rgba(90, 67, 53, 0.14);
      border-radius: 55% 55% 48% 48%;
    }

    .cookie-left {
      left: 10px;
      transform-origin: 90% 75%;
      clip-path: polygon(0 18%, 100% 0, 90% 100%, 14% 78%);
    }

    .cookie-right {
      right: 10px;
      transform-origin: 10% 75%;
      clip-path: polygon(0 0, 100% 18%, 86% 78%, 10% 100%);
    }

    .cookie-fold {
      position: absolute;
      left: 50%;
      top: 54px;
      width: 28px;
      height: 28px;
      background: linear-gradient(180deg, #e2bf9a 0%, #d4aa83 100%);
      border-radius: 50%;
      transform: translateX(-50%);
      box-shadow: 0 4px 10px rgba(90,67,53,0.10);
    }

    .fortune-paper {
      position: absolute;
      left: 50%;
      top: 64px;
      width: 86px;
      height: 22px;
      background: #fffaf5;
      border-radius: 4px;
      border: 1px solid rgba(120,95,75,0.10);
      transform: translateX(-50%) translateY(10px);
      opacity: 0;
      box-shadow: 0 6px 14px rgba(90,67,53,0.08);
    }

    .cookie-text {
      font-size: 14px;
      color: var(--brown-soft);
      line-height: 1.8;
      margin-top: 6px;
    }

    .cookie-shell.open .cookie-left {
      animation: cookieLeftOpen 0.7s ease forwards;
    }

    .cookie-shell.open .cookie-right {
      animation: cookieRightOpen 0.7s ease forwards;
    }

    .cookie-shell.open .fortune-paper {
      animation: paperRise 0.55s ease 0.34s forwards;
    }

    .cookie-shell.open .cookie-fold {
      opacity: 0.4;
      transition: opacity 0.3s ease;
    }

    @keyframes cookieLeftOpen {
      0% { transform: rotate(0deg) translateX(0); }
      100% { transform: rotate(-30deg) translateX(-16px) translateY(-2px); }
    }

    @keyframes cookieRightOpen {
      0% { transform: rotate(0deg) translateX(0); }
      100% { transform: rotate(30deg) translateX(16px) translateY(-2px); }
    }

    @keyframes paperRise {
      0% {
        opacity: 0;
        transform: translateX(-50%) translateY(12px) scale(0.96);
      }
      100% {
        opacity: 1;
        transform: translateX(-50%) translateY(-26px) scale(1);
      }
    }

    /* 결과 카드 */
    
.fortune-card {
  border-radius: 24px;
  padding: 24px 22px 22px;
  background: rgba(255, 250, 245, 0.58);
  border: 1px solid rgba(255,255,255,0.72);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.55),
    0 10px 20px rgba(90, 67, 53, 0.05);
  position: relative;
  overflow: hidden;
  transition: background 0.4s ease, box-shadow 0.4s ease;
  isolation: isolate;
  backdrop-filter: blur(1px);
  -webkit-backdrop-filter: blur(1px);
}

.fortune-card::before,
.fortune-card::after {
  content: "";
  position: absolute;
  inset: -2%;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.35s ease;
  z-index: 0;
}
    .fortune-card.theme-on::before,
    .fortune-card.theme-on::after {
      opacity: 1;
    }

    .fortune-label,
    .fortune-type,
    .fortune-message {
      position: relative;
      z-index: 1;
    }

    .fortune-label {
      font-size: 13px;
      line-height: 1.7;
      letter-spacing: 0.06em;
      color: var(--brown-light);
      margin-bottom: 10px;
    }

    .fortune-type {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
      line-height: 1.5;
      color: var(--brown);
      margin-bottom: 16px;
      word-break: keep-all;
    }

    .fortune-message {
      font-size: 20px;
      line-height: 1.9;
      color: var(--brown);
      white-space: pre-line;
      word-break: keep-all;
    }

    /* ====== 타입별 효과: 카드 안에서 보이게 ====== */

    .theme-soft-breath::before {
      background:
        radial-gradient(circle at 18% 24%, rgba(255,255,255,0.38) 0 18px, transparent 19px),
        radial-gradient(circle at 78% 22%, rgba(255,255,255,0.24) 0 14px, transparent 15px),
        radial-gradient(ellipse at center, rgba(255,255,255,0.10), transparent 72%);
    }

.theme-sunlight::before {
  background:
    linear-gradient(125deg,
      rgba(255,215,150,0.34) 0%,
      rgba(255,235,190,0.22) 18%,
      rgba(255,255,255,0.00) 42%),
    radial-gradient(circle at 82% 18%, rgba(255,245,220,0.30) 0 16px, transparent 17px);
  opacity: 1 !important;
}

.theme-sunlight::after {
  background:
    linear-gradient(118deg,
      rgba(255,255,255,0.00) 0%,
      rgba(255,240,210,0.22) 42%,
      rgba(255,255,255,0.00) 54%);
  opacity: 0.9 !important;
}

    .theme-slow-breath::before {
      background:
        linear-gradient(135deg,
          rgba(255,255,255,0.20) 0 10%,
          rgba(255,255,255,0.00) 10% 20%,
          rgba(255,255,255,0.12) 20% 30%,
          rgba(255,255,255,0.00) 30% 40%,
          rgba(255,255,255,0.10) 40% 50%,
          rgba(255,255,255,0.00) 50% 100%);
      opacity: 0.45 !important;
    }

    .theme-light-day::before {
      background:
        radial-gradient(ellipse at top center, rgba(255,255,255,0.28), transparent 68%),
        radial-gradient(circle at 86% 18%, rgba(255,255,255,0.24) 0 10px, transparent 11px);
    }

.theme-warm-rest::before {
  background:
    radial-gradient(ellipse at bottom center, rgba(255,225,195,0.34), transparent 56%);
  opacity: 1 !important;
}

.theme-warm-rest::after {
  inset: auto 0 -8px 0;
  height: 110px;
  background:
    radial-gradient(ellipse at 18% 100%, rgba(255,255,255,0.34) 0 42%, transparent 43%),
    radial-gradient(ellipse at 50% 100%, rgba(255,245,235,0.32) 0 44%, transparent 45%),
    radial-gradient(ellipse at 82% 100%, rgba(255,255,255,0.28) 0 40%, transparent 41%);
  opacity: 0.95 !important;
}

.theme-water-glass::before {
  background:
    radial-gradient(circle at 50% 84%, rgba(210,235,236,0.70) 0 22px, transparent 23px),
    radial-gradient(circle at 50% 84%, transparent 0 34px, rgba(210,235,236,0.52) 35px 37px, transparent 38px),
    radial-gradient(circle at 50% 84%, transparent 0 50px, rgba(210,235,236,0.38) 51px 53px, transparent 54px);
  opacity: 1 !important;
}

.theme-water-glass::after {
  background:
    linear-gradient(180deg, rgba(240,250,250,0.22), rgba(255,255,255,0));
  opacity: 0.8 !important;
}

    .theme-less-heavy::before {
      background:
        radial-gradient(ellipse at bottom left, rgba(255,242,229,0.34), transparent 48%),
        radial-gradient(ellipse at bottom right, rgba(255,245,234,0.24), transparent 44%);
    }

    .theme-slowly-ok::before {
      background:
        linear-gradient(110deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.00) 46%);
    }
    .theme-slowly-ok::after {
      inset: 0 auto 0 0;
      width: 42%;
      background:
        radial-gradient(ellipse at left center, rgba(255,255,255,0.16), transparent 72%);
    }

    .theme-no-endure::before {
      background:
        radial-gradient(circle at center, transparent 0 38%, rgba(255,244,231,0.26) 39% 40%, transparent 41%);
      opacity: 0.75 !important;
    }

.theme-small-comma::before {
  background:
    radial-gradient(circle at 50% 24%, rgba(255,240,220,0.30) 0 18px, transparent 19px);
  opacity: 1 !important;
}

.theme-small-comma::after {
  inset: auto auto 22% 47%;
  width: 20px;
  height: 28px;
  border-radius: 50%;
  background: rgba(255,220,190,0.46);
  transform: rotate(18deg);
  box-shadow: 0 14px 0 -7px rgba(255,220,190,0.42);
  opacity: 1 !important;
}

    .theme-body-first::before {
      background:
        radial-gradient(ellipse at center top, rgba(255,255,255,0.30), transparent 62%);
    }

.theme-enough-today::before {
  background:
    radial-gradient(circle at 18% 24%, rgba(255,230,190,0.36) 0 14px, transparent 15px),
    radial-gradient(circle at 86% 24%, rgba(255,235,200,0.32) 0 12px, transparent 13px),
    radial-gradient(circle at 14% 76%, rgba(255,240,210,0.26) 0 10px, transparent 11px),
    radial-gradient(circle at 82% 74%, rgba(255,245,220,0.18) 0 8px, transparent 9px);
  opacity: 1 !important;
}

.theme-enough-today::after {
  background:
    radial-gradient(ellipse at center, rgba(255,255,255,0.12), transparent 72%);
  opacity: 0.8 !important;
}

    .theme-gentle-recovery::before {
      background:
        linear-gradient(160deg, rgba(255,255,255,0.10), rgba(255,255,255,0.00) 35%);
    }
    .theme-gentle-recovery::after {
      inset: auto 0 0 0;
      height: 110px;
      background:
        radial-gradient(ellipse at 15% 100%, rgba(255,255,255,0.24) 0 38%, transparent 39%),
        radial-gradient(ellipse at 45% 100%, rgba(255,255,255,0.18) 0 42%, transparent 43%),
        radial-gradient(ellipse at 75% 100%, rgba(255,255,255,0.15) 0 34%, transparent 35%);
      opacity: 0.5 !important;
    }

    .theme-soft-air::before {
      background:
        radial-gradient(ellipse at 50% 16%, rgba(255,255,255,0.32), transparent 54%),
        radial-gradient(circle at 76% 72%, rgba(255,255,255,0.12) 0 10px, transparent 11px);
    }

    .theme-still-comfort::before {
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.14) 0 2px, transparent 3px),
        radial-gradient(circle at 78% 24%, rgba(255,255,255,0.14) 0 2px, transparent 3px),
        radial-gradient(circle at 84% 76%, rgba(255,255,255,0.10) 0 2px, transparent 3px),
        radial-gradient(circle at 16% 78%, rgba(255,255,255,0.10) 0 2px, transparent 3px);
      opacity: 0.95 !important;
    }

    .theme-one-tempo::before {
      background:
        radial-gradient(ellipse at bottom center, rgba(255,239,222,0.28), transparent 54%);
    }
    .theme-one-tempo::after {
      inset: auto 14% 14% 14%;
      height: 80px;
      background:
        radial-gradient(ellipse at center, rgba(255,255,255,0.14), transparent 72%);
      opacity: 0.8 !important;
    }

    .theme-small-comfort::before {
      background:
        radial-gradient(circle at 86% 16%, rgba(255,255,255,0.28) 0 16px, transparent 17px),
        linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.00) 36%);
    }

    .theme-less-effort::before {
      background:
        radial-gradient(ellipse at center, rgba(255,255,255,0.14), transparent 72%);
    }

    .theme-whole-today::before {
      background:
        radial-gradient(ellipse at center top, rgba(255,244,230,0.22), transparent 58%);
    }
    .theme-whole-today::after {
      inset: auto 0 0 0;
      height: 90px;
      background:
        radial-gradient(ellipse at 20% 100%, rgba(255,255,255,0.16) 0 34%, transparent 35%),
        radial-gradient(ellipse at 50% 100%, rgba(255,255,255,0.14) 0 38%, transparent 39%),
        radial-gradient(ellipse at 80% 100%, rgba(255,255,255,0.12) 0 34%, transparent 35%);
      opacity: 0.6 !important;
    }

    .footer-line {
      width: 110px;
      height: 1px;
      background: var(--line);
      margin: 30px auto 18px;
    }

    .footer {
      font-size: 13px;
      line-height: 1.85;
      color: var(--brown-light);
      word-break: keep-all;
    }

    @media (max-width: 480px) {
      body { padding: 18px; }

      .card {
        min-height: 640px;
        padding: 34px 22px 28px;
        border-radius: 26px;
      }

      .brand {
        font-size: 13px;
        margin-bottom: 22px;
      }

      .title {
        font-size: 28px;
      }

      .subtitle {
        font-size: 14px;
        margin-bottom: 22px;
      }

      .divider {
        margin-bottom: 24px;
      }

      .fortune-stage {
        min-height: 340px;
      }

      .fortune-intro {
        font-size: 15px;
      }

      .cookie-shell {
        width: 170px;
        height: 140px;
      }

      .cookie-half {
        width: 78px;
        height: 84px;
      }

      .fortune-type {
        font-size: 25px;
      }

      .fortune-message {
        font-size: 18px;
      }

      button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="page-glow"></div>

  <div class="card">
    <div class="brand">Perfection</div>
    <h1 class="title">잠깐, 숨 고르기</h1>
    <p class="subtitle">오늘의 메시지를 열어보세요</p>
    <div class="divider"></div>

    <div class="fortune-stage">
      <div class="screen" id="introScreen">
        <p class="fortune-intro">
          오늘의 작은 메시지가 도착했어요.<br>
          지금의 나를 위한 한 문장을 열어보세요.
        </p>

        <div class="button-wrap">
          <button onclick="openFortune()">포춘 열기</button>
        </div>
      </div>

      <div class="screen hidden" id="cookieScreen">
        <div class="cookie-wrap">
          <div class="cookie-shell" id="fortuneCookie">
            <div class="cookie-half cookie-left"></div>
            <div class="cookie-half cookie-right"></div>
            <div class="cookie-fold"></div>
            <div class="fortune-paper"></div>
          </div>
          <div class="cookie-text">오늘의 포춘을 여는 중...</div>
        </div>
      </div>

      <div class="screen hidden" id="resultScreen">
        <div class="fortune-card" id="fortuneCard">
          <div class="fortune-label">오늘의 회복</div>
          <div class="fortune-type" id="fortuneType"></div>
          <div class="fortune-message" id="fortuneMessage"></div>
        </div>

        <div class="button-wrap">
          <button class="sub-button" onclick="showAnotherFortune()">다른 메시지 보기</button>
        </div>
      </div>
    </div>

    <div class="footer-line"></div>
    <div class="footer">
      HAROO 브라와 함께 보내는<br>
      작은 위로 한 장
    </div>
  </div>

  <script>
    const fortunes = [
      { type: "작은 숨 타입", message: "오늘은 조금 덜 애써도 괜찮아요.", theme: "soft-breath" },
      { type: "햇살 타입", message: "작은 불편 하나만 덜어도 하루가 달라져요.", theme: "sunlight" },
      { type: "느린 호흡 타입", message: "천천히 가도 괜찮아요.", theme: "slow-breath" },
      { type: "가벼운 하루 타입", message: "조금 더 가볍게 숨 쉬는 하루가 되길 바랍니다.", theme: "light-day" },
      { type: "따뜻한 휴식 타입", message: "작은 휴식 하나도 충분히 의미 있어요.", theme: "warm-rest" },
      { type: "조용한 회복 타입", message: "지금의 하루가 조금 덜 복잡하길 바랍니다.", theme: "quiet-recovery" },
      { type: "물 한 잔 타입", message: "물 한 잔 챙기는 것도 충분한 돌봄이에요.", theme: "water-glass" },
      { type: "덜 무거운 하루 타입", message: "조금 덜 무겁고,\n조금 더 편안한 하루가 되길 바랍니다.", theme: "less-heavy" },
      { type: "천천히 괜찮은 타입", message: "다 하지 못해도 괜찮아요.", theme: "slowly-ok" },
      { type: "참지 않아도 되는 타입", message: "불편함을 참지 않아도 괜찮아요.", theme: "no-endure" },
      { type: "작은 쉼표 타입", message: "오늘은 한 템포 쉬어가도 괜찮아요.", theme: "small-comma" },
      { type: "몸 먼저 타입", message: "오늘도 몸이 먼저인 하루를 보내요.", theme: "body-first" },
      { type: "오늘도 충분한 타입", message: "오늘도 충분히 잘하고 있어요.", theme: "enough-today" },
      { type: "느긋한 회복 타입", message: "오늘의 나를 너무 몰아붙이지 않기로 해요.", theme: "gentle-recovery" },
      { type: "부드러운 숨 타입", message: "조금 더 부드럽게 숨 쉬는 하루가 되길 바랍니다.", theme: "soft-air" },
      { type: "가만한 위로 타입", message: "지금 이 순간에도 이미 충분해요.", theme: "still-comfort" },
      { type: "한 템포 쉬어가기 타입", message: "몸이 편해야 마음도 조금 덜 지쳐요.", theme: "one-tempo" },
      { type: "작은 편안함 타입", message: "참는 것보다 편안한 쪽을 먼저 골라요.", theme: "small-comfort" },
      { type: "덜 애써도 되는 타입", message: "오늘은 조금 덜 애써도 괜찮아요.", theme: "less-effort" },
      { type: "온전한 오늘 타입", message: "HAROO 브라가 오늘을\n조금 더 가볍게 만들어주길 바랍니다.", theme: "whole-today" }
    ];

    function randomFortune() {
      const index = Math.floor(Math.random() * fortunes.length);
      return fortunes[index];
    }

    function applyTheme(themeName) {
      const card = document.getElementById("fortuneCard");
      card.className = "fortune-card theme-on theme-" + themeName;
    }

    function setFortuneContent(fortune) {
      document.getElementById("fortuneType").textContent = fortune.type;
      document.getElementById("fortuneMessage").innerHTML = fortune.message.replace(/\n/g, "<br>");
      applyTheme(fortune.theme);
    }

    function openFortune() {
      const intro = document.getElementById("introScreen");
      const cookieScreen = document.getElementById("cookieScreen");
      const result = document.getElementById("resultScreen");
      const cookie = document.getElementById("fortuneCookie");

      intro.classList.add("fade-out");

      setTimeout(() => {
        intro.classList.add("hidden");
        intro.classList.remove("fade-out");

        cookieScreen.classList.remove("hidden");
        cookieScreen.classList.add("fade-in");

        setTimeout(() => {
          cookie.classList.add("open");
        }, 120);

        setTimeout(() => {
          const today = randomFortune();
          setFortuneContent(today);

          cookieScreen.classList.add("fade-out");

          setTimeout(() => {
            cookieScreen.classList.add("hidden");
            cookieScreen.classList.remove("fade-in");
            cookieScreen.classList.remove("fade-out");
            cookie.classList.remove("open");

            result.classList.remove("hidden");
            result.classList.add("fade-in");

            setTimeout(() => {
              result.classList.remove("fade-in");
            }, 450);
          }, 320);
        }, 1450);
      }, 220);
    }

    function showAnotherFortune() {
      const result = document.getElementById("resultScreen");
      result.classList.add("fade-out");

      setTimeout(() => {
        const today = randomFortune();
        setFortuneContent(today);

        result.classList.remove("fade-out");
        result.classList.add("fade-in");

        setTimeout(() => {
          result.classList.remove("fade-in");
        }, 450);
      }, 220);
    }
  </script>
</body>
</html>
