<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>잠깐, 숨 고르기</title>
  <style>
    :root {
      --bg1: #f6f1eb;
      --bg2: #efe7dd;
      --paper: #fbf7f2;
      --paper2: #f8f2eb;
      --brown: #5b4639;
      --brown-soft: #877264;
      --brown-light: #a39387;
      --line: rgba(112, 88, 70, 0.14);
      --button1: #6f5849;
      --button2: #5c4639;
      --warm: #ecdac8;
      --warm2: #f2e6da;
      --gold: #edd5ae;
      --mint: #dceceb;
      --white: rgba(255,255,255,0.9);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      color: var(--brown);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 12% 10%, rgba(255,255,255,0.96), transparent 22%),
        linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.10;
      background-image:
        repeating-linear-gradient(
          0deg,
          rgba(120,95,75,0.02) 0px,
          rgba(120,95,75,0.02) 1px,
          transparent 1px,
          transparent 5px
        );
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.40;
      background:
        linear-gradient(
          120deg,
          rgba(255,255,255,0.42) 0%,
          rgba(255,255,255,0.02) 18%,
          rgba(255,255,255,0.14) 36%,
          rgba(255,255,255,0.02) 54%,
          rgba(255,255,255,0.08) 72%,
          rgba(255,255,255,0.00) 100%
        );
      transform: translateX(-4%);
    }

    .page-glow {
      position: fixed;
      left: 0;
      right: 0;
      bottom: -40px;
      height: 220px;
      pointer-events: none;
      background:
        radial-gradient(ellipse at center,
          rgba(255,255,255,0.82) 0%,
          rgba(255,255,255,0.20) 40%,
          rgba(255,255,255,0.00) 76%);
      filter: blur(8px);
    }

    .wrap {
      width: 100%;
      max-width: 520px;
      position: relative;
      z-index: 2;
    }

    .card-shell {
      width: 100%;
      min-height: 700px;
      border-radius: 34px;
      background: linear-gradient(180deg, rgba(252,248,244,0.97), rgba(249,244,238,0.97));
      border: 1px solid rgba(255,255,255,0.88);
      box-shadow:
        0 20px 50px rgba(90,67,53,0.08),
        0 8px 18px rgba(90,67,53,0.05),
        inset 0 1px 0 rgba(255,255,255,0.78);
      padding: 40px 28px 34px;
      overflow: hidden;
      position: relative;
    }

    .brand {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 15px;
      letter-spacing: 0.24em;
      color: var(--brown-soft);
      text-align: center;
      margin-bottom: 22px;
    }

    .title {
      margin: 0 0 12px;
      text-align: center;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 30px;
      font-weight: 400;
      letter-spacing: -0.01em;
      color: var(--brown);
    }

    .subtitle {
      margin: 0;
      text-align: center;
      font-size: 15px;
      line-height: 1.8;
      color: var(--brown-soft);
      word-break: keep-all;
    }

    .divider {
      width: 68px;
      height: 1px;
      margin: 28px auto 34px;
      background: var(--line);
    }

    .stage {
      min-height: 390px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .screen {
      width: 100%;
      max-width: 392px;
      margin: 0 auto;
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .hidden { display: none; }
    .fade-out { opacity: 0; transform: translateY(8px); }
    .fade-in { opacity: 1; transform: translateY(0); }

    .intro-text {
      text-align: center;
      font-size: 16px;
      line-height: 1.9;
      color: var(--brown-soft);
      word-break: keep-all;
      margin: 0 0 30px;
    }

    .btn-wrap {
      text-align: center;
      margin-top: 8px;
    }

    button {
      appearance: none;
      border: none;
      outline: none;
      cursor: pointer;
      border-radius: 999px;
      padding: 14px 26px;
      font-size: 15px;
      line-height: 1;
      color: #fff;
      background: linear-gradient(180deg, var(--button1) 0%, var(--button2) 100%);
      box-shadow:
        0 12px 24px rgba(90,67,53,0.14),
        inset 0 1px 0 rgba(255,255,255,0.16);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow:
        0 15px 28px rgba(90,67,53,0.18),
        inset 0 1px 0 rgba(255,255,255,0.18);
    }

    .ghost-btn {
      background: rgba(255,255,255,0.58);
      color: var(--brown-soft);
      border: 1px solid rgba(117,95,77,0.16);
      box-shadow: none;
      width: 100%;
      max-width: 320px;
    }

    .ghost-btn:hover {
      background: rgba(255,255,255,0.74);
      box-shadow: none;
    }

    /* fortune cookie */
    .cookie-wrap {
      min-height: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .cookie-shell {
      position: relative;
      width: 188px;
      height: 150px;
      margin-bottom: 18px;
    }

    .cookie-half {
      position: absolute;
      top: 24px;
      width: 88px;
      height: 92px;
      background: linear-gradient(180deg, #e6c7a7 0%, #d7af89 100%);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.28),
        0 10px 18px rgba(90,67,53,0.12);
      border-radius: 55% 55% 48% 48%;
    }

    .cookie-left {
      left: 10px;
      transform-origin: 90% 75%;
      clip-path: polygon(0 18%, 100% 0, 90% 100%, 14% 78%);
    }

    .cookie-right {
      right: 10px;
      transform-origin: 10% 75%;
      clip-path: polygon(0 0, 100% 18%, 86% 78%, 10% 100%);
    }

    .cookie-fold {
      position: absolute;
      left: 50%;
      top: 54px;
      width: 28px;
      height: 28px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #e2bf9a 0%, #d4aa83 100%);
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(90,67,53,0.10);
    }

    .fortune-paper {
      position: absolute;
      left: 50%;
      top: 64px;
      width: 86px;
      height: 22px;
      transform: translateX(-50%) translateY(10px);
      opacity: 0;
      background: #fffaf5;
      border: 1px solid rgba(120,95,75,0.10);
      border-radius: 4px;
      box-shadow: 0 6px 14px rgba(90,67,53,0.08);
    }

    .cookie-text {
      font-size: 14px;
      line-height: 1.8;
      color: var(--brown-soft);
      text-align: center;
    }

    .cookie-shell.open .cookie-left {
      animation: cookieLeftOpen 0.7s ease forwards;
    }

    .cookie-shell.open .cookie-right {
      animation: cookieRightOpen 0.7s ease forwards;
    }

    .cookie-shell.open .fortune-paper {
      animation: paperRise 0.55s ease 0.34s forwards;
    }

    @keyframes cookieLeftOpen {
      0% { transform: rotate(0deg) translateX(0); }
      100% { transform: rotate(-30deg) translateX(-16px) translateY(-2px); }
    }

    @keyframes cookieRightOpen {
      0% { transform: rotate(0deg) translateX(0); }
      100% { transform: rotate(30deg) translateX(16px) translateY(-2px); }
    }

    @keyframes paperRise {
      0% {
        opacity: 0;
        transform: translateX(-50%) translateY(12px) scale(0.96);
      }
      100% {
        opacity: 1;
        transform: translateX(-50%) translateY(-26px) scale(1);
      }
    }

    /* result */
    .fortune-card {
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      min-height: 282px;
      padding: 24px 22px 26px;
      background: linear-gradient(180deg, rgba(252,248,244,0.97), rgba(249,244,238,0.96));
      border: 1px solid rgba(255,255,255,0.9);
      box-shadow:
        0 14px 28px rgba(90,67,53,0.05),
        inset 0 1px 0 rgba(255,255,255,0.78);
      isolation: isolate;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fortune-visual {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      border-radius: inherit;
    }

    .fortune-visual span {
      position: absolute;
      display: none;
    }

    .fortune-card.theme-soft-breath .v1,
    .fortune-card.theme-soft-breath .v2,
    .fortune-card.theme-soft-breath .v3,
    .fortune-card.theme-sunlight .v1,
    .fortune-card.theme-sunlight .v2,
    .fortune-card.theme-sunlight .v3,
    .fortune-card.theme-slow-breath .v1,
    .fortune-card.theme-slow-breath .v2,
    .fortune-card.theme-slow-breath .v3,
    .fortune-card.theme-light-day .v1,
    .fortune-card.theme-light-day .v2,
    .fortune-card.theme-light-day .v3,
    .fortune-card.theme-warm-rest .v1,
    .fortune-card.theme-warm-rest .v2,
    .fortune-card.theme-warm-rest .v3,
    .fortune-card.theme-quiet-recovery .v1,
    .fortune-card.theme-quiet-recovery .v2,
    .fortune-card.theme-quiet-recovery .v3,
    .fortune-card.theme-water-glass .v1,
    .fortune-card.theme-water-glass .v2,
    .fortune-card.theme-water-glass .v3,
    .fortune-card.theme-less-heavy .v1,
    .fortune-card.theme-less-heavy .v2,
    .fortune-card.theme-less-heavy .v3,
    .fortune-card.theme-slowly-ok .v1,
    .fortune-card.theme-slowly-ok .v2,
    .fortune-card.theme-slowly-ok .v3,
    .fortune-card.theme-no-endure .v1,
    .fortune-card.theme-no-endure .v2,
    .fortune-card.theme-no-endure .v3,
    .fortune-card.theme-small-comma .v1,
    .fortune-card.theme-small-comma .v2,
    .fortune-card.theme-small-comma .v3,
    .fortune-card.theme-body-first .v1,
    .fortune-card.theme-body-first .v2,
    .fortune-card.theme-body-first .v3,
    .fortune-card.theme-enough-today .v1,
    .fortune-card.theme-enough-today .v2,
    .fortune-card.theme-enough-today .v3,
    .fortune-card.theme-gentle-recovery .v1,
    .fortune-card.theme-gentle-recovery .v2,
    .fortune-card.theme-gentle-recovery .v3,
    .fortune-card.theme-soft-air .v1,
    .fortune-card.theme-soft-air .v2,
    .fortune-card.theme-soft-air .v3,
    .fortune-card.theme-still-comfort .v1,
    .fortune-card.theme-still-comfort .v2,
    .fortune-card.theme-still-comfort .v3,
    .fortune-card.theme-one-tempo .v1,
    .fortune-card.theme-one-tempo .v2,
    .fortune-card.theme-one-tempo .v3,
    .fortune-card.theme-small-comfort .v1,
    .fortune-card.theme-small-comfort .v2,
    .fortune-card.theme-small-comfort .v3,
    .fortune-card.theme-less-effort .v1,
    .fortune-card.theme-less-effort .v2,
    .fortune-card.theme-less-effort .v3,
    .fortune-card.theme-whole-today .v1,
    .fortune-card.theme-whole-today .v2,
    .fortune-card.theme-whole-today .v3 {
      display: block;
    }

    .fortune-content {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 310px;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .fortune-label {
      font-size: 13px;
      letter-spacing: 0.06em;
      line-height: 1.7;
      color: var(--brown-light);
      margin-bottom: 12px;
      text-align: center;
    }

    .fortune-type {
      margin: 0 0 18px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
      line-height: 1.35;
      color: var(--brown);
      word-break: keep-all;
      text-align: center;
    }

    .fortune-message {
      margin: 0;
      font-size: 20px;
      line-height: 1.8;
      color: var(--brown);
      white-space: pre-line;
      word-break: keep-all;
      text-align: center;
    }

    .result-buttons {
      margin-top: 24px;
      text-align: center;
    }

    .footer-line {
      width: 110px;
      height: 1px;
      background: var(--line);
      margin: 34px auto 20px;
    }

    .footer {
      text-align: center;
      font-size: 13px;
      line-height: 1.9;
      color: var(--brown-light);
      word-break: keep-all;
    }

    /* ===== 20 organized themes ===== */

    /* 1 작은 숨 */
    .fortune-card.theme-soft-breath .v1 {
      width: 210px; height: 210px;
      left: -34px; top: -28px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.92) 0%, rgba(244,234,224,0.42) 56%, transparent 74%);
    }
    .fortune-card.theme-soft-breath .v2 {
      width: 72px; height: 72px;
      right: 26px; top: 28px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.72), transparent 72%);
    }
    .fortune-card.theme-soft-breath .v3 {
      width: 150px; height: 40px;
      left: 50%; bottom: 18px; transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.28), transparent 72%);
    }

    /* 2 햇살 */
    .fortune-card.theme-sunlight .v1 {
      inset: 0;
      background:
        linear-gradient(125deg, rgba(243,216,171,0.42) 0%, rgba(243,216,171,0.18) 14%, rgba(255,255,255,0) 28%),
        linear-gradient(125deg, rgba(255,240,220,0.28) 22%, rgba(255,255,255,0) 36%),
        linear-gradient(125deg, rgba(255,232,199,0.22) 40%, rgba(255,255,255,0) 54%);
    }
    .fortune-card.theme-sunlight .v2 {
      width: 28px; height: 28px;
      right: 28px; top: 24px;
      border-radius: 50%;
      background: rgba(251,239,214,0.82);
      box-shadow: 0 0 0 10px rgba(251,239,214,0.22);
    }
    .fortune-card.theme-sunlight .v3 {
      width: 170px; height: 70px;
      left: -24px; top: -12px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(248,229,191,0.42), transparent 72%);
    }

    /* 3 느린 호흡 */
    .fortune-card.theme-slow-breath .v1 {
      inset: 0;
      background:
        linear-gradient(160deg,
          rgba(255,255,255,0.00) 0%,
          rgba(255,255,255,0.22) 10%,
          rgba(255,255,255,0.00) 20%,
          rgba(255,255,255,0.16) 30%,
          rgba(255,255,255,0.00) 40%,
          rgba(255,255,255,0.12) 50%,
          rgba(255,255,255,0.00) 60%);
      opacity: 0.72;
    }
    .fortune-card.theme-slow-breath .v2 {
      width: 190px; height: 90px;
      right: -18px; bottom: 0;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.34), transparent 74%);
    }
    .fortune-card.theme-slow-breath .v3 {
      width: 110px; height: 110px;
      left: -20px; top: 40px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.18), transparent 72%);
    }

    /* 4 가벼운 하루 */
    .fortune-card.theme-light-day .v1 {
      width: 230px; height: 100px;
      left: 50%; top: -22px; transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.84), transparent 72%);
    }
    .fortune-card.theme-light-day .v2 {
      width: 84px; height: 84px;
      right: 24px; top: 24px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.56), transparent 72%);
    }
    .fortune-card.theme-light-day .v3 {
      width: 150px; height: 30px;
      left: 50%; bottom: 18px; transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.22), transparent 72%);
    }

    /* 5 따뜻한 휴식 */
    .fortune-card.theme-warm-rest .v1 {
      width: 280px; height: 120px;
      left: -24px; bottom: -10px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(238,220,199,0.54), transparent 72%);
    }
    .fortune-card.theme-warm-rest .v2 {
      width: 280px; height: 120px;
      right: -30px; bottom: -12px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.34), transparent 72%);
    }
    .fortune-card.theme-warm-rest .v3 {
      width: 110%; height: 76px;
      left: -5%; bottom: -18px;
      background:
        radial-gradient(ellipse at 12% 0%, rgba(255,255,255,0.40) 0 34%, transparent 35%),
        radial-gradient(ellipse at 38% 0%, rgba(255,245,235,0.36) 0 36%, transparent 37%),
        radial-gradient(ellipse at 65% 0%, rgba(255,255,255,0.30) 0 35%, transparent 36%),
        radial-gradient(ellipse at 88% 0%, rgba(255,245,235,0.26) 0 32%, transparent 33%);
    }

    /* 6 조용한 회복 */
    .fortune-card.theme-quiet-recovery .v1 {
      width: 230px; height: 230px;
      left: 50%; top: 18px; transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.44), rgba(255,255,255,0.00) 72%);

    .fortune-card.theme-quiet-recovery .v2 {
      width: 130px; height: 32px;
      left: 50%; bottom: 18px; transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.20), transparent 72%);
    }
    .fortune-card.theme-quiet-recovery .v3 { display: none; }

    /* 7 물 한 잔 */
    .fortune-card.theme-water-glass .v1 {
      width: 72px; height: 72px;
      left: 50%; bottom: 28px; transform: translateX(-50%);

    .fortune-card.theme-water-glass .v2 {

      border-radius: 50%;
      border: 2px solid rgba(206,228,226,0.58);
      background: transparent;
    }
    .fortune-card.theme-water-glass .v3 {
      width: 152px; height: 152px;
      left: 50%; bottom: -14px; transform: translateX(-50%);

      border: 2px solid rgba(206,228,226,0.36);
      background: transparent;
    }

    /* 8 덜 무거운 하루 */

      width: 210px; height: 100px;

      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(240,223,206,0.56), transparent 72%);
    }
    .fortune-card.theme-less-heavy .v2 {
      width: 210px; height: 100px;
      right: -24px; bottom: -10px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.34), transparent 72%);
    }
    .fortune-card.theme-less-heavy .v3 {
      width: 160px; height: 28px;
      left: 50%; bottom: 26px; transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.20), transparent 72%);
    }

    /* 9 천천히 괜찮은 */
    .fortune-card.theme-slowly-ok .v1 {
      inset: 0;
      background: linear-gradient(110deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.00) 42%);
    }
    .fortune-card.theme-slowly-ok .v2 {
      width: 150px; height: 150px;
      left: -18px; top: 40px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.20), transparent 72%);
    }
    .fortune-card.theme-slowly-ok .v3 {
      width: 90px; height: 90px;
      right: 22px; bottom: 18px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.18), transparent 72%);
    }

    /* 10 참지 않아도 되는 */
    .fortune-card.theme-no-endure .v1 {
      width: 142px; height: 142px;
      left: 50%; top: 56px; transform: translateX(-50%);
      border-radius: 50%;
      border: 3px solid rgba(240,222,206,0.70);
      background: transparent;
    }
    .fortune-card.theme-no-endure .v2 {
      width: 192px; height: 192px;
      left: 50%; top: 30px; transform: translateX(-50%);
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.34);
      background: transparent;
    }
    .fortune-card.theme-no-endure .v3 {
      width: 242px; height: 242px;
      left: 50%; top: 6px; transform: translateX(-50%);
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.24);
      background: transparent;
    }

    /* 11 작은 쉼표 */
    .fortune-card.theme-small-comma .v1 {
      width: 34px; height: 44px;
      right: 42px; top: 24px;
      border-radius: 50%;
      background: rgba(239,219,196,0.80);
      transform: rotate(18deg);
      box-shadow: 0 18px 0 -10px rgba(239,219,196,0.70);
    }
    .fortune-card.theme-small-comma .v2 {
      width: 110px; height: 110px;
      right: -12px; top: -10px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,248,236,0.60), transparent 72%);
    }
    .fortune-card.theme-small-comma .v3 {
      width: 120px; height: 22px;
      left: 22px; bottom: 18px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.18), transparent 72%);
    }

    /* 12 몸 먼저 */
    .fortune-card.theme-body-first .v1 {
      width: 240px; height: 100px;
      left: 50%; top: -24px; transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.88), rgba(255,255,255,0.00) 72%);
    }
    .fortune-card.theme-body-first .v2 {
      width: 140px; height: 140px;
      left: -30px; bottom: -30px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.18), transparent 72%);
    }
    .fortune-card.theme-body-first .v3 {
      width: 140px; height: 140px;
      right: -30px; bottom: -30px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.18), transparent 72%);
    }

    /* 13 오늘도 충분한 */
    .fortune-card.theme-enough-today .v1 {
      width: 22px; height: 22px;
      left: 22px; top: 20px;
      border-radius: 50%;
      background: rgba(243,224,196,0.84);
      box-shadow:
        296px 8px 0 rgba(243,224,196,0.76),
        28px 172px 0 rgba(243,224,196,0.58),
        284px 162px 0 rgba(243,224,196,0.48);
    }
    .fortune-card.theme-enough-today .v2 {
      width: 190px; height: 190px;
      left: 50%; top: 30px; transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.28), transparent 72%);
    }
    .fortune-card.theme-enough-today .v3 { display: none; }

    /* 14 느긋한 회복 */
    .fortune-card.theme-gentle-recovery .v1 {
      inset: 0;
      background: linear-gradient(150deg, rgba(255,255,255,0.12), rgba(255,255,255,0.00) 38%);
    }
    .fortune-card.theme-gentle-recovery .v2 {
      width: 110%; height: 72px;
      left: -5%; bottom: -14px;
      background:
        radial-gradient(ellipse at 18% 0%, rgba(255,255,255,0.34) 0 36%, transparent 37%),
        radial-gradient(ellipse at 50% 0%, rgba(255,245,235,0.30) 0 38%, transparent 39%),
        radial-gradient(ellipse at 82% 0%, rgba(255,255,255,0.24) 0 34%, transparent 35%);
    }
    .fortune-card.theme-gentle-recovery .v3 {
      width: 170px; height: 30px;
      left: 50%; bottom: 28px; transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.16), transparent 72%);
    }

    /* 15 부드러운 숨 */
    .fortune-card.theme-soft-air .v1 {
      width: 210px; height: 86px;
      left: 50%; top: 4px; transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.76), transparent 72%);
    }
    .fortune-card.theme-soft-air .v2 {
      width: 16px; height: 16px;
      right: 38px; bottom: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,0.56);
      box-shadow: -24px -8px 0 rgba(255,255,255,0.36);
    }
    .fortune-card.theme-soft-air .v3 {
      width: 120px; height: 22px;
      left: 24px; bottom: 18px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.18), transparent 72%);
    }

    /* 16 가만한 위로 */
    .fortune-card.theme-still-comfort .v1 {
      width: 6px; height: 6px;
      left: 22px; top: 20px;
      border-radius: 50%;
      background: rgba(255,255,255,0.68);
      box-shadow:
        296px 14px 0 rgba(255,255,255,0.54),
        22px 172px 0 rgba(255,255,255,0.40),
        286px 162px 0 rgba(255,255,255,0.36);
    }
    .fortune-card.theme-still-comfort .v2 {
      width: 170px; height: 170px;
      left: 50%; top: 46px; transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.18), transparent 72%);
    }
    .fortune-card.theme-still-comfort .v3 { display:none; }

    /* 17 한 템포 쉬어가기 */
    .fortune-card.theme-one-tempo .v1 {
      width: 250px; height: 100px;
      left: 50%; bottom: -6px; transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(239,223,207,0.54), transparent 72%);
    }
    .fortune-card.theme-one-tempo .v2 {
      width: 134px; height: 30px;
      left: 50%; bottom: 30px; transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.22), transparent 72%);
    }
    .fortune-card.theme-one-tempo .v3 {
      width: 62px; height: 62px;
      left: 26px; top: 26px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.20), transparent 72%);
    }

    /* 18 작은 편안함 */
    .fortune-card.theme-small-comfort .v1 {
      inset: 0;
      background: linear-gradient(140deg, rgba(255,255,255,0.12), rgba(255,255,255,0.00) 36%);
    }
    .fortune-card.theme-small-comfort .v2 {
      width: 112px; height: 112px;
      right: -10px; top: -6px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.62), transparent 72%);
    }
    .fortune-card.theme-small-comfort .v3 {
      width: 124px; height: 20px;
      right: 16px; bottom: 18px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.16), transparent 72%);
    }

    /* 19 덜 애써도 되는 */
    .fortune-card.theme-less-effort .v1 {
      width: 290px; height: 140px;
      left: 50%; top: 42px; transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.34), rgba(255,255,255,0.00) 72%);
    }
    .fortune-card.theme-less-effort .v2 {
      width: 96px; height: 96px;
      left: 8px; bottom: -8px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.18), transparent 72%);
    }
    .fortune-card.theme-less-effort .v3 {
      width: 96px; height: 96px;
      right: 8px; bottom: -8px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.18), transparent 72%);
    }

    /* 20 온전한 오늘 */
    .fortune-card.theme-whole-today .v1 {
      width: 250px; height: 100px;
      left: 50%; top: -20px; transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(244,228,208,0.48), transparent 72%);
    }
    .fortune-card.theme-whole-today .v2 {
      width: 110%; height: 74px;
      left: -5%; bottom: -14px;
      background:
        radial-gradient(ellipse at 18% 0%, rgba(255,255,255,0.30) 0 34%, transparent 35%),
        radial-gradient(ellipse at 50% 0%, rgba(255,245,235,0.24) 0 38%, transparent 39%),
        radial-gradient(ellipse at 82% 0%, rgba(255,255,255,0.20) 0 34%, transparent 35%);
    }
    .fortune-card.theme-whole-today .v3 {
      width: 72px; height: 72px;
      right: 24px; top: 22px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.32), transparent 72%);
    }

    @media (max-width: 480px) {
      body { padding: 16px; }

      .card-shell {
        min-height: 670px;
        border-radius: 30px;
        padding: 34px 18px 28px;
      }

      .brand {
        font-size: 14px;
        margin-bottom: 20px;
      }

      .title {
        font-size: 28px;
      }

      .subtitle {
        font-size: 14px;
      }

      .divider {
        width: 72px;
        margin: 24px auto 28px;
      }

      .stage {
        min-height: 360px;
      }

      .intro-text {
        font-size: 15px;
      }

      .fortune-card {
        min-height: 250px;
        padding: 22px 18px 24px;
      }

      .fortune-content {
        max-width: 300px;
        min-height: 168px;
      }

      .fortune-label {
        font-size: 12px;
        margin-bottom: 12px;
      }

      .fortune-type {
        font-size: 26px;
        margin-bottom: 16px;
      }

      .fortune-message {
        font-size: 18px;
        line-height: 1.85;
      }

      .ghost-btn {
        max-width: none;
      }
    }
  </style>
</head>
<body>
  <div class="page-glow"></div>

  <div class="wrap">
    <div class="card-shell">
      <div class="brand">Perfection</div>
      <h1 class="title">잠깐, 숨 고르기</h1>
      <p class="subtitle">오늘의 메시지를 열어보세요</p>
      <div class="divider"></div>

      <div class="stage">
        <div class="screen" id="introScreen">
          <p class="intro-text">
            오늘의 작은 메시지가 도착했어요.<br>
            지금의 나를 위한 한 문장을 열어보세요.
          </p>
          <div class="btn-wrap">
            <button onclick="openFortune()">포춘 열기</button>
          </div>
        </div>

        <div class="screen hidden" id="cookieScreen">
          <div class="cookie-wrap">
            <div class="cookie-shell" id="fortuneCookie">
              <div class="cookie-half cookie-left"></div>
              <div class="cookie-half cookie-right"></div>
              <div class="cookie-fold"></div>
              <div class="fortune-paper"></div>
            </div>
            <div class="cookie-text">또각, 오늘의 포춘을 여는 중...</div>
          </div>
        </div>

        <div class="screen hidden" id="resultScreen">
          <div class="fortune-card" id="fortuneCard">
            <div class="fortune-visual">
              <span class="v1"></span>
              <span class="v2"></span>
              <span class="v3"></span>
            </div>
            <div class="fortune-content">
              <div class="fortune-label">오늘의 회복</div>
              <h2 class="fortune-type" id="fortuneType"></h2>
              <p class="fortune-message" id="fortuneMessage"></p>
            </div>
          </div>

          <div class="result-buttons">
            <button class="ghost-btn" onclick="showAnotherFortune()">다른 메시지 보기</button>
          </div>
        </div>
      </div>

      <div class="footer-line"></div>
      <div class="footer">
        HAROO 브라와 함께 보내는<br>
        작은 위로 한 장
      </div>
    </div>
  </div>

  <script>
    const fortunes = [
      { type: "작은 숨 타입", message: "오늘은 조금 덜 애써도 괜찮아요.", theme: "soft-breath" },
      { type: "햇살 타입", message: "작은 불편 하나만 덜어도 하루가 달라져요.", theme: "sunlight" },
      { type: "느린 호흡 타입", message: "천천히 가도 괜찮아요.", theme: "slow-breath" },
      { type: "가벼운 하루 타입", message: "조금 더 가볍게 숨 쉬는 하루가 되길 바랍니다.", theme: "light-day" },
      { type: "따뜻한 휴식 타입", message: "작은 휴식 하나도 충분히 의미 있어요.", theme: "warm-rest" },
      { type: "조용한 회복 타입", message: "지금의 하루가 조금 덜 복잡하길 바랍니다.", theme: "quiet-recovery" },
      { type: "물 한 잔 타입", message: "물 한 잔 챙기는 것도 충분한 돌봄이에요.", theme: "water-glass" },
      { type: "덜 무거운 하루 타입", message: "조금 덜 무겁고,\n조금 더 편안한 하루가 되길 바랍니다.", theme: "less-heavy" },
      { type: "천천히 괜찮은 타입", message: "다 하지 못해도 괜찮아요.", theme: "slowly-ok" },
      { type: "참지 않아도 되는 타입", message: "불편함을 참지 않아도 괜찮아요.", theme: "no-endure" },
      { type: "작은 쉼표 타입", message: "오늘은 한 템포 쉬어가도 괜찮아요.", theme: "small-comma" },
      { type: "몸 먼저 타입", message: "오늘도 몸이 먼저인 하루를 보내요.", theme: "body-first" },
      { type: "오늘도 충분한 타입", message: "오늘도 충분히 잘하고 있어요.", theme: "enough-today" },
      { type: "느긋한 회복 타입", message: "오늘의 나를 너무 몰아붙이지 않기로 해요.", theme: "gentle-recovery" },
      { type: "부드러운 숨 타입", message: "조금 더 부드럽게 숨 쉬는 하루가 되길 바랍니다.", theme: "soft-air" },
      { type: "가만한 위로 타입", message: "지금 이 순간에도 이미 충분해요.", theme: "still-comfort" },
      { type: "한 템포 쉬어가기 타입", message: "몸이 편해야 마음도 조금 덜 지쳐요.", theme: "one-tempo" },
      { type: "작은 편안함 타입", message: "참는 것보다 편안한 쪽을 먼저 골라요.", theme: "small-comfort" },
      { type: "덜 애써도 되는 타입", message: "오늘은 조금 덜 애써도 괜찮아요.", theme: "less-effort" },
      { type: "온전한 오늘 타입", message: "HAROO 브라가 오늘을\n조금 더 가볍게 만들어주길 바랍니다.", theme: "whole-today" }
    ];

    function randomFortune() {
      const index = Math.floor(Math.random() * fortunes.length);
      return fortunes[index];
    }

    function applyTheme(themeName) {
      const card = document.getElementById("fortuneCard");
      card.className = "fortune-card theme-" + themeName;
    }

    function setFortuneContent(fortune) {
      document.getElementById("fortuneType").textContent = fortune.type;
      document.getElementById("fortuneMessage").innerHTML = fortune.message.replace(/\n/g, "<br>");
      applyTheme(fortune.theme);
    }

    function openFortune() {
      const intro = document.getElementById("introScreen");
      const cookieScreen = document.getElementById("cookieScreen");
      const result = document.getElementById("resultScreen");
      const cookie = document.getElementById("fortuneCookie");

      intro.classList.add("fade-out");

      setTimeout(() => {
        intro.classList.add("hidden");
        intro.classList.remove("fade-out");

        cookieScreen.classList.remove("hidden");
        cookieScreen.classList.add("fade-in");

        setTimeout(() => {
          cookie.classList.add("open");
        }, 120);

        setTimeout(() => {
          const today = randomFortune();
          setFortuneContent(today);

          cookieScreen.classList.add("fade-out");

          setTimeout(() => {
            cookieScreen.classList.add("hidden");
            cookieScreen.classList.remove("fade-in");
            cookieScreen.classList.remove("fade-out");
            cookie.classList.remove("open");

            result.classList.remove("hidden");
            result.classList.add("fade-in");

            setTimeout(() => {
              result.classList.remove("fade-in");
            }, 400);
          }, 320);
        }, 1450);
      }, 220);
    }

    function showAnotherFortune() {
      const result = document.getElementById("resultScreen");
      result.classList.add("fade-out");

      setTimeout(() => {
        const today = randomFortune();
        setFortuneContent(today);

        result.classList.remove("fade-out");
        result.classList.add("fade-in");

        setTimeout(() => {
          result.classList.remove("fade-in");
        }, 400);
      }, 220);
    }
  </script>
</body>
</html>
